<html>
<head>
    <title>Drawing!</title>
    <style>
        * {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
<canvas id="canv">

</canvas>
<script src="engine/components/Vector2.js"></script>
<script src="engine/Engine.js"></script>
<script src="engine/Input.js"></script>

<script>
    let position = new Vector2(50, 50);

    function update() {
        if (Input.keysDown.includes('KeyW')) position.y -= 1;
        if (Input.keysDown.includes('KeyS')) position.y += 1;
        if (Input.keysDown.includes('KeyA')) position.x -= 1;
        if (Input.keysDown.includes('KeyD')) position.x += 1;
    }

    function draw(ctx) {
        ctx.save();

        ctx.translate(position.x, position.y);
        ctx.lineTo(150, 10);

        ctx.lineTo(90, 20);
        ctx.lineTo(85, 0);
        ctx.lineTo(80, 5);
        ctx.lineTo(70, 5);
        ctx.lineTo(65, 0);
        ctx.lineTo(60, 20);

        ctx.lineTo(0, 10);
        ctx.lineTo(50, 60);

        ctx.lineTo(55, 55);
        ctx.lineTo(95, 55);

        ctx.lineTo(100, 60);

        ctx.fillStyle = "black";
        ctx.fill();

        ctx.restore()
    }

    Engine.start();
</script>
</body>
</html>
