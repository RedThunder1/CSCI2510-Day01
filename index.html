<html>
<head>
    <title>Drawing!</title>
</head>
<body>
<canvas id="canv">

</canvas>
<script>
    const canvas = document.getElementById("canv");
    const ctx = canvas.getContext("2d");

    ctx.save()

    ctx.translate(50, 50)

    ctx.lineTo(0, -40)
    ctx.lineTo(-40, 40)
    ctx.lineTo(40, 40)

    ctx.fillStyle ="red"
    ctx.fill()

    ctx.restore()

    ctx.beginPath()
    ctx.lineTo(250, 50)

    ctx.lineTo(190, 60)
    ctx.lineTo(185, 40)
    ctx.lineTo(180, 45)
    ctx.lineTo(170, 45)
    ctx.lineTo(165, 40)
    ctx.lineTo(160, 60)

    ctx.lineTo(100, 50)
    ctx.lineTo(150, 100)

    ctx.lineTo(155, 95)
    ctx.lineTo(195, 95)

    ctx.lineTo(200, 100)

    ctx.fillStyle = "black"
    ctx.fill()

    ctx.restore()
</script>
</body>
</html>
