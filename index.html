<html>
<head>
    <title>Drawing!</title>
    <style>
        * {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
<canvas id="canv">

</canvas>
<script src="Vector2.js"></script>
<script>
    function update() {
        position.x += .5;
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    const canvas = document.getElementById("canv");
    const ctx = canvas.getContext("2d");

    let position = new Vector2(50, 50);

    function draw() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        ctx.save();

        ctx.translate(position.x, position.y);
        ctx.lineTo(150, 10);

        ctx.lineTo(90, 20);
        ctx.lineTo(85, 0);
        ctx.lineTo(80, 5);
        ctx.lineTo(70, 5);
        ctx.lineTo(65, 0);
        ctx.lineTo(60, 20);

        ctx.lineTo(0, 10);
        ctx.lineTo(50, 60);

        ctx.lineTo(55, 55);
        ctx.lineTo(95, 55);

        ctx.lineTo(100, 60);

        ctx.fillStyle = "black";
        ctx.fill();

        ctx.restore()
    }

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
